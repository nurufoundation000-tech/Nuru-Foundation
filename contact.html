<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Nuru Foundation</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* --------- Global Styles --------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --primary-color: #6a0572;
        --secondary-color: #f7b731;
        --accent-color-1: #38b2ac;
        --accent-color-2: #ef476f;
        --text-dark: #333;
        --text-light: #f9f9f9;
        --background-light: #ffffff;
        --background-dark: #2c3e50;
        --font-family-body: 'Poppins', sans-serif;
        --font-family-heading: 'Fredoka One', cursive;
        --border-radius-lg: 30px;
        --border-radius-md: 18px;
        --shadow-md: 0 10px 25px rgba(0,0,0,0.12);
        --shadow-lg: 0 20px 50px rgba(0,0,0,0.2);
        --gradient-main: linear-gradient(135deg, var(--primary-color) 0%, #a40e94 100%);
        --gradient-accent: linear-gradient(45deg, var(--accent-color-1) 0%, #5ed1cb 100%);
        --gradient-cta: linear-gradient(90deg, var(--accent-color-2) 0%, #ff6b81 100%);
    }
    html { scroll-behavior: smooth; }
    body {
        font-family: var(--font-family-body);
        line-height: 1.8;
        color: var(--text-dark);
        background-color: #eaf6ff;
        overflow-x: hidden;
    }
    h1,h2,h3,h4,h5,h6 { font-family: var(--font-family-heading); color: var(--primary-color); margin-bottom: 1rem; line-height: 1.3; }
    a { color: var(--accent-color-1); text-decoration: none; transition: all 0.3s ease; }
    a:hover { color: var(--secondary-color); transform: translateY(-2px); }
    .container { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
    .btn { display: inline-block; padding: 1.1rem 3.5rem; border-radius: var(--border-radius-lg); font-family: var(--font-family-heading); text-transform: uppercase; font-weight: 700; cursor: pointer; border: none; transition: all 0.3s ease; box-shadow: var(--shadow-md); position: relative; z-index: 1; }
    .btn:hover { transform: translateY(-7px) scale(1.04); box-shadow: var(--shadow-lg); }

    /* --------- Header --------- */
    header {
        background: var(--gradient-main);
        padding: 1.5rem 0;
        color: var(--text-light);
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: var(--shadow-md);
    }
    .navbar { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .logo { font-family: var(--font-family-heading); font-size: 2rem; color: var(--text-light); letter-spacing: 2px; }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links a { color: var(--text-light); font-weight: 600; transition: all 0.3s ease; }
    .nav-links a:hover { color: var(--secondary-color); }

    /* --------- Hero Section --------- */
    .contact-hero {
        background: var(--gradient-main);
        color: var(--text-light);
        padding: 8rem 0 4rem;
        text-align: center;
        border-bottom-left-radius: var(--border-radius-lg);
        border-bottom-right-radius: var(--border-radius-lg);
        position: relative;
        overflow: hidden;
    }
    .contact-hero::before, .contact-hero::after {
        content: '';
        position: absolute;
        background: rgba(255,255,255,0.15);
        border-radius: 50%;
        animation: rotateFade 20s infinite linear;
        z-index: 0;
    }
    .contact-hero::before { width: 350px; height: 350px; top: -10%; left: -5%; animation-delay: 0s; }
    .contact-hero::after { width: 450px; height: 450px; bottom: -15%; right: -8%; animation-delay: 5s; }
    @keyframes rotateFade {
        0% { transform: rotate(0deg) scale(0.9); opacity: 0.7; }
        50% { transform: rotate(180deg) scale(1.1); opacity: 0.4; }
        100% { transform: rotate(360deg) scale(0.9); opacity: 0.7; }
    }
    .contact-hero h1 { font-size: 4rem; margin-bottom: 1rem; text-shadow: 4px 4px 10px rgba(0,0,0,0.6); }
    .contact-hero p { font-size: 1.4rem; max-width: 800px; margin: 0 auto; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }

    /* --------- Contact Section --------- */
    .contact-section { padding: 6rem 0; background-color: var(--background-light); }
    .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px,1fr)); gap: 3rem; }
    .contact-card { background: var(--background-light); padding: 3rem; border-radius: var(--border-radius-lg); box-shadow: var(--shadow-md); border: 2px solid #eee; transition: transform 0.3s ease, box-shadow 0.3s ease; position: relative; overflow: hidden; }
    .contact-card:hover { transform: translateY(-12px) scale(1.02); box-shadow: var(--shadow-lg); }
    .contact-card h2 { text-align: center; font-size: 2.5rem; margin-bottom: 2rem; color: var(--accent-color-1); }

    /* Form Styles */
    form { display: flex; flex-direction: column; }
    label { margin-top: 1rem; margin-bottom: 0.5rem; font-weight: 600; color: var(--primary-color); font-size: 1.1rem; }
    input, textarea {
        padding: 1rem; border-radius: var(--border-radius-md); border: 1px solid #ccc; font-size: 1rem; margin-bottom: 1rem; font-family: var(--font-family-body);
        transition: all 0.3s ease;
    }
    input:focus, textarea:focus { border-color: var(--accent-color-1); outline: none; box-shadow: 0 0 15px rgba(56,178,172,0.3); }
    .form-card .btn { background: var(--gradient-cta); color: var(--text-light); font-family: var(--font-family-heading); padding: 1.1rem 3rem; border-radius: var(--border-radius-lg); box-shadow: var(--shadow-md); border: none; text-transform: uppercase; }
    .form-card .btn:hover { transform: translateY(-7px) scale(1.04); box-shadow: var(--shadow-lg); background: var(--gradient-accent); }

    /* Info Card Styling */
    .info-card .info-item { display: flex; align-items: center; margin-bottom: 2rem; }
    .info-card .info-item i { font-size: 3rem; color: var(--secondary-color); margin-right: 1.2rem; transition: color 0.3s ease; }
    .info-card .info-item i:hover { color: var(--accent-color-1); }
    .info-card .info-item p { font-size: 1.15rem; color: #555; line-height: 1.6; }

    /* --------- Footer --------- */
    footer { background: var(--gradient-main); padding: 4rem 1.5rem; color: var(--text-light); text-align: center; border-top-left-radius: var(--border-radius-lg); border-top-right-radius: var(--border-radius-lg); box-shadow: var(--shadow-lg); margin-top: 3rem; }
    footer p { font-size: 1rem; margin-bottom: 1rem; }
    footer .social-links { margin-top: 1rem; }
    footer .social-links a { color: var(--text-light); margin: 0 1rem; font-size: 1.5rem; transition: all 0.3s ease; }
    footer .social-links a:hover { color: var(--secondary-color); transform: translateY(-2px); }

    /* Responsive */
    @media(max-width:768px){ .contact-grid{gap:2rem;} .contact-card{padding:2.5rem;} .contact-card h2{font-size:2rem;} input,textarea{font-size:0.9rem;} .contact-hero h1{font-size:3rem;} .contact-hero p{font-size:1.2rem;} .nav-links{gap:1rem;} }
    @media(max-width:576px){ .contact-grid{gap:1.5rem;} .contact-card{padding:2rem;} .contact-card h2{font-size:1.8rem;} input,textarea{font-size:0.85rem;} .contact-hero h1{font-size:2.2rem;} .contact-hero p{font-size:1rem;} }
</style>
</head>
<body>

<!-- Header -->
<header>
    <div class="navbar">
        <div class="logo">NURU</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="courses.html">Courses</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>
</header>

<!-- Hero Section -->
<section class="contact-hero">
    <div class="container">
        <h1>Contact Nuru Foundation</h1>
        <p>We would love to hear from you! Please send your inquiries, feedback, or partnership requests.</p>
    </div>
</section>

<!-- Contact Section -->
<section class="contact-section container">
    <div class="contact-grid">
        <!-- Info Card -->
        <div class="contact-card info-card">
            <div class="info-item"><i class="fas fa-map-marker-alt"></i><p>Nairobi, Kenya</p></div>
            <div class="info-item"><i class="fas fa-envelope"></i><p>info@nuru-foundation.org</p></div>
            <div class="info-item"><i class="fas fa-phone"></i><p>+254 713 160 899</p></div>
        </div>

        <!-- Form Card -->
        <div class="contact-card form-card">
            <h2>Send Us a Message</h2>
            <form id="contactForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </div>
</section>

<!-- Footer -->
<footer>
    <p>&copy; 2025 Nuru Foundation. All Rights Reserved.</p>
    <div class="social-links">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
    </div>
</footer>

<!-- JS -->
<script>
    document.getElementById('contactForm').addEventListener('submit', function(e){
        e.preventDefault();
        alert('Thank you for contacting Nuru Foundation! We will get back to you shortly.');
        this.reset();
    });
</script>

</body>
</html>
